server.port=9090

spring.datasource.url=jdbc:mysql://localhost:3306/local_data?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 启动时执行 schema.sql，自动补齐 wx_user / user_favorite 表
spring.sql.init.mode=always

# 微信端调用 /user/** 接口时需携带的密钥，请求头 X-Api-Key
# Docker 部署时通过环境变量注入（docker run -e WX_API_KEY=xxx / compose environment），不写进镜像
wx.api-key=${WX_API_KEY}
